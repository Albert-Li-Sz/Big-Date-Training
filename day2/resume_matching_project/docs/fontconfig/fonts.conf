<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Headless LibreOffice resets HOME for isolation, so declare CJK font
       locations explicitly for deterministic local report rendering. -->
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/System/Library/AssetsV2</dir>
  <dir>/Library/Fonts</dir>
  <dir>/Users/albert_li/Library/Fonts</dir>
  <dir>/Users/albert_li/.cache/codex-runtimes/codex-primary-runtime/dependencies/native/libreoffice-headless/libreoffice/LibreOfficeDev.app/Contents/Resources/fonts/truetype</dir>
  <cachedir>/private/tmp/codex-fontconfig-cache</cachedir>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Arial Unicode MS</family>
      <family>Microsoft YaHei</family>
      <family>Heiti SC</family>
    </prefer>
  </alias>
</fontconfig>
